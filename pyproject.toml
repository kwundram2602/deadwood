[project]
name = "deadwood"
version = "0.1.0"
description = "Crown segmentation from multispectral aerial imagery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "graphviz>=0.21",
    "cartopy>=0.25.0",
    "geopandas>=1.1.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "omegaconf>=2.3",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "pyarrow>=21.0.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch>=2.10.0",
    "torchgeo>=0.9.0",
    "torchview>=0.2.7",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.19",
    "ultraplot>=2.5.0",
    "rioxarray>=0.23.0",
    "dask>=2026.7.1",
    "cmcrameri>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

# ── PyTorch index: CPU wheels on Windows/macOS, CUDA 12.8 on Linux (HPC) ────
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu",   marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "gwi"
url = "https://gisidx.github.io/gwi"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
