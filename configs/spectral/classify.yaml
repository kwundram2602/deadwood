paths:
  reference: datafiles/process_out/masks/crown_mask.tif
  stack_dir: datafiles/process_out/timeseries
  samples: datafiles/process_out/spectral/samples.parquet
  # MUST be the SAME file as paths.ndsm in analysis.yaml — the nDSM this
  # model's training samples were extracted with. Two nDSM variants exist on
  # disk (metres and normalized) and both sit on the reference grid, so
  # nothing else can catch a mix-up: predictions would just be wrong.
  # spectral_classify.py copies the training nDSM's identity into
  # model_dir/ndsm_reference.json and spectral_apply.py fails loudly if the
  # file named here does not match it.
  ndsm: datafiles/process_out/ndsm_in_m/20260801_174831/dsm_ndsm_dtm_raw_m.tif
  out_dir: out/spectral
  model_dir: out/spectral/model

classify:
  # Explicit list — no implicit date window. Every date here must have an
  # aligned stack and a column in samples.parquet. The count drives the feature
  # width: 6 per-date measures x N, plus 12 temporal aggregates, plus ndsm.
  #
  # One seasonal cycle ending at 20260313 — the scene the crown mask and the
  # field polygons come from, so the labels are valid at the end of it.
  # Training on the older 2023/24 dates would apply 2026 labels to imagery from
  # two and a half years earlier.
  #
  # Thinned from the 19 available dates to 12 (85 features instead of 127) by
  # walking the living-crown NDVI curve and spacing picks evenly along its ARC
  # LENGTH rather than along time: the information sits in the transitions, not
  # the plateaus. Four dry-season dates were dropped because they repeat each
  # other; three dates inside five weeks are kept across the green-up because
  # the curve moves fastest there. Forced keeps: the dry trough (20250907), the
  # wet peak (20260226), the maximum living-vs-deadwood separation (20251121)
  # and the survey anchor (20260313).
  #
  # Measured median NDVI over the field polygons, for context: living and
  # deadwood are 0.015 apart in August/September — indistinguishable — and
  # 0.320 apart on 20251121. That gap is the entire reason this is a time
  # series and not a single date.
  cycle:
    dates:
      - "20250417"
      - "20250526"
      - "20250605"
      - "20250719"
      - "20250907"
      - "20251015"
      - "20251027"
      - "20251121"
      - "20251219"
      - "20260126"
      - "20260226"
      - "20260313"
  n_splits: 5
  n_estimators: 400
  seed: 0
  permutation_repeats: 5

apply:
  tile_size: 1024
  stride: 896
  min_object_m2: 0.5
  prob_raster: out/spectral/deadwood_prob.tif
  class_raster: out/spectral/deadwood_class.tif
  objects: out/spectral/deadwood_objects.gpkg

retrospect:
  enabled: false
  # Keys must be zero-padded "YYYY_YY" season labels (e.g. "2023_24") sorted
  # in chronological order. first_dead_cycle ranks cycles by plain
  # lexicographic sort of these keys, and that only agrees with chronological
  # order when they're zero-padded this way — e.g. "2023_9" would sort after
  # "2023_10". Keys that don't match this shape log a warning rather than
  # failing outright, but the resulting date may be silently wrong.
  cycles: {}
  out_dir: out/spectral/retrospect
