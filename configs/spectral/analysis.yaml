paths:
  # Only the grid geometry (shape/transform/CRS) — the crown content itself
  # comes from crown_prediction below.
  reference: datafiles/process_out/masks/crown_mask.tif
  stack_dir: datafiles/process_out/timeseries
  coreg_report: datafiles/process_out/timeseries/coreg_report.csv
  crowns:
    - datafiles/crown_poly/2_crown_main_20260409_editLP.gpkg
  # The crown-segmentation model's own output over the full 2026 scene — this is
  # the surface the deadwood classifier meets at inference time, which is why the
  # `living` pool comes from here and not from the son field polygons.
  # Use the BINARISED prediction, not the *_prob.tif beside it: the probability
  # raster carries nodata = -1.0, and binarize_crown_mask only recognises 255.
  # A -1 pixel would read as "valid but below threshold", i.e. background rather
  # than "not evaluated", and the 45.8% of the grid outside the source footprint
  # would flood the background pool with all-NaN samples.
  # The 0.9 threshold is already baked into this file; sampling.crown_threshold
  # below only separates its 1s from its 0s.
  crown_prediction: sample_exp/crown_fullstack__OAM_RGB_RESNET50_TCD__bce0.3_dice0.6/predict/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_RGB_merged_stack_c9ae7f13_5cm_pred_t0.9.tif
  # Height above ground in METRES, not the normalized variant under
  # process_out/ndsm/ — the feature goes into the forest unscaled, so metres
  # keep the feature importance readable.
  # MUST be the SAME file as paths.ndsm in classify.yaml. Two nDSM variants
  # exist on disk (metres and normalized) and both sit on the reference grid,
  # so the grid check cannot tell them apart; training on one and predicting
  # with the other is silently wrong. This stage writes the nDSM's identity to
  # samples_ndsm_reference.json next to samples.parquet, and spectral_apply.py
  # refuses to run against a different one.
  ndsm: datafiles/process_out/ndsm_in_m/20260801_174831/dsm_ndsm_dtm_raw_m.tif
  samples: datafiles/process_out/spectral/samples.parquet
  out_dir: out/spectral

sampling:
  crown_threshold: 0.5
  erode_m: 0.10
  exclude_buffer_m: 1.0
  edge_buffer_m: 0.25
  block_m: 20.0
  negative_ratio: 5.0
  max_pixels_per_class: 200000
  seed: 0

extract:
  # DISABLED after measurement, not as a shortcut. Phase-correlation
  # co-registration is not feasible on this site. Evidence:
  #   - estimate_shift is correct: on real tile data it recovers a synthetic
  #     (+3,-2) and (+40,+15) px shift exactly.
  #   - Between real dates it returns one axis ~0 and the other absurd
  #     (124, 240, -207 px) — the signature of a correlation peak that is a
  #     wrap-around artifact rather than a match.
  #   - The best inter-date Pearson r anywhere in the AOI is 0.603, median
  #     0.222 over 38 fully-valid non-crown candidate windows. Reliable phase
  #     correlation needs ~0.9.
  #   - Even at that best location the estimate is unstable: 20260226 gives
  #     (-0.0,-0.1) but 20251219 gives (-113,0) at r=0.598.
  #   - Selecting tiles for texture instead made it worse (36 flagged vs 12).
  # Cause: savanna at 5 cm has no hard permanent structure. Grass, soil and
  # shadow content changes completely between flights, so there is nothing for
  # the correlation to lock onto.
  # Consequence: the flags are noise, and leaving this true discarded 12 dates
  # including 3 of the 12 training-cycle dates for no reason.
  # Registration therefore rests on the upstream _coreg alignment plus the QGIS
  # overlay check. Residual error is UNQUANTIFIED — state that in any writeup.
  exclude_flagged_dates: false
  chunk_rows: 2048
