# Fine-tuning the pretrained deadtrees deadwood model on the Airport crowns.
#
# Usage:
#   uv run python scripts/finetune_deadwood.py \
#       --config configs/finetune/deadwood.yaml --working_dir .

model_name: deadwood_ft
run_tag: null
output_dir: experiments/deadwood/dice
weights: datafiles/deadtress_weights/segformer_b5_full_epoch_100.safetensors

dataset:
  path: out/deadwood_patches   # written by scripts/preprocess_deadwood.py
  batch_size: 4                # Patches are 512 px since the mask rework — a quarter
                               # the pixels of the old 1024 px crops — so 8 here costs
                               # roughly what 2 did then (~1.74 GiB on a 4 GB card).
                               # Raised from 2 because most tiles hold only one class
                               # (21 crown-only, 18 background-only, 7 both): at batch 2
                               # a step usually sees "everything labelled is deadwood" or
                               # "everything labelled is not", and the gradient swings
                               # with it. Lower it again if the card runs out.
  num_workers: 2               # safe here — patches are per-file reads, not a
                               # shared whole-scene GDAL handle

# head | decoder — how much of the model adapts.
stage: decoder

transfer:
  epochs: 80
  lr: 0.00002
  weight_decay: 0.001
  optimizer: adamw
  scheduler: step
  step_gamma: 0.76
  warmup_epochs: 3
  patience: 10

# Second phase: partial encoder unfreeze. Valid mit_b5 keys are
# patch_embed1..4, block1..4, norm1..4 — encoder-relative, so "norm4", not
# "encoder.norm4". Decoder and segmentation_head need no key: every phase
# trains them. block3 (66.3 M of the 84.7 M) stays frozen either way.
fine_tune:
  enabled: true
  epochs: 15
  lr: 0.00002
  weight_decay: 0.001
  unfreeze_keys: ["block4", "norm4"]
  encoder_lr_scale: 0.1
  optimizer: adamw
  scheduler: step
  step_gamma: 0.5
  warmup_epochs: 2
  patience: 8

loss:
  bce: 0.5
  dice: 1.0
  dice_squared: false
  iou: 0.0
  mae: 0.0

metrics:
  thresholds: [0.5]
  target_thresholds: [0.5]

train:
  amp: true

logging:
  use_wandb: false
  project: deadwood
  run_name: null
  log_every_n_steps: 50
