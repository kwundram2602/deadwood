# Crown x deadwood x nDSM height class -> combo codes and an ecological class map.
# Run from deadwood/ as working directory; all paths are relative to --working_dir.
#
# Usage:
#   uv run python scripts/fuse_masks.py --config configs/fusion/fuse.yaml --working_dir .
#
# All three rasters must sit on exactly the crown mask's grid. The deadwood mask
# therefore has to be predicted on the co-registered ortho (OM_domAligned), not
# on raster_merged, which is ~2 m off.

fuse:
  crown: sample_exp/crown_fullstack__OAM_RGB_RESNET50_TCD__bce0.3_dice1__1709/predict/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_coreg_stack_5d1a875f_5cm_fp_pred_t0.9.tif
  deadwood: out/raw_deadwood/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_coreg_deadwood_mask.tif
  ndsm: datafiles/process_out/ndsm_in_m/20260917_142553/dsm_ndsm_dtm_raw_m.tif

  # [h1, h2] in metres: low < h1 <= mid < h2 <= tall.
  height_m: [1.0, 3.0]

  out_dir: out/fusion
  out_stem: null      # null -> deadwood file stem without "_deadwood_mask"
  chunk_rows: 512

  # Combo code = C + 2*D + 4*Hc:
  #   low:  0 ground          1 crown_low   2 dead_low   3 dead_crown_low
  #   mid:  4 unlabelled_mid  5 crown_mid   6 dead_mid   7 dead_crown_mid
  #   tall: 8 unlabelled_tall 9 crown_tall 10 dead_tall 11 dead_crown_tall
  # Every code must appear exactly once below. Eco values 1..254 (255 = nodata).
  classes:
    1:  {name: living_tree,     color: "#1a9641", codes: [9]}
    2:  {name: living_shrub,    color: "#a6d96a", codes: [1, 5]}
    3:  {name: dead_crown_tall, color: "#67001f", codes: [11]}
    4:  {name: dead_crown_mid,  color: "#b2182b", codes: [7]}
    5:  {name: dead_crown_low,  color: "#d6604d", codes: [3]}
    6:  {name: standing_dead,   color: "#d7191c", codes: [10]}
    7:  {name: dead_mid,        color: "#f46d43", codes: [6]}
    8:  {name: lying_dead,      color: "#fdae61", codes: [2]}
    9:  {name: unlabelled_tall, color: "#542788", codes: [8]}
    10: {name: unlabelled_mid,  color: "#998ec3", codes: [4]}
    11: {name: ground,          color: "#f0f0f0", codes: [0]}
