# Preprocessing pipeline config.
# Run from deadwood/ as working directory.
# All paths are relative to deadwood/.
#
# Usage (full pipeline):
#   uv run python scripts/preprocess.py --config configs/preprocess.yaml --working_dir .
#
# Usage (individual stages):
#   uv run python explore_and_process/rasterize_crowns.py --config configs/preprocess.yaml
#   uv run python explore_and_process/apply_dsm_mask.py   --config configs/preprocess.yaml
#   uv run python explore_and_process/tile_patches.py     --config configs/preprocess.yaml
#
rasterize:
# crowns: field datasets to rasterize (vector → raster mask)
  crowns:
    - datafiles/crown_poly/crowns_altered.gpkg
  # reference raster: grid only (CRS, transform, extent) — inputs come from sources
  reference: datafiles/OM_domAligned/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_coreg.tif
  # sources: rasters stacked (in order) into one training image.
  # names travel with the data (band descriptions + channels.json);
  # the train config selects model inputs from these names + 'ndsm'.
  sources:
    - path: datafiles/OM_domAligned/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_coreg.tif
      bands: [1, 2, 3, 4, 5, 6, 7]
      names: [red, green, blue, green_ms, red_ms, rededge, nir]
  out_mask: datafiles/process_out/masks/crown_mask_intermediate_erode.tif
  out_image_dir: datafiles/process_out/images
  # raster_dir: only valid with exactly ONE source entry; its bands/names apply
  # to every *_OM_*.tif in the dir (the source's path is ignored)
  raster_dir: null
  target_gsd: 0.05
  # Polygon shape correction BEFORE rasterizing (metres, UTM CRS).
  # Both 0.0 → polygons are rasterized as digitised.
  erode: 0.1          # shrink crowns by this amount (negative buffer)
  # Corner rounding: opening + closing with round joins (buffer -r, +2r, -r).
  # Removes spikes thinner than 2r and fills notches; larger = rounder crowns.
  # Polygons that vanish are dropped with a warning — their pixels become 255, not 0.
  round_radius: 0.1
  # Gaussian smoothing (px) applied to the reference raster before rasterizing the crowns. Higher = more smoothing, less detail in the mask.
  sigma: 3.0
  nodata_threshold: 0.05
  # Lowest value the Gaussian falloff may drop to.
  soft_floor: 0.5

# DSM/DTM-based mask generation (nDSM = DSM - DTM)
# also corregistration of DSm, DTM
dsm_mask:
  mask: datafiles/process_out/masks/crown_mask_intermediate_erode.tif
  dsm: datafiles/DSM_domAligned/20260313_Airport_Main_MAVICM3MFIXEDM3M_DSM_coreg.tif
  # out / out_dsm: auto-derived from mask path + params + timestamp.
  # Set explicitly here only to override the default locations.
  # External DTM and its co-registration onto the DSM. Read only when
  # method or ndsm_channel is dtm; ignored for dtm_approx.
  dtm_real:
    path: datafiles/dtm/20250727_Airport_M350L2_dem.tif
    #path: datafiles/dtms/KNP_dtm_025m_UTM36S_2431DC_clipped_aligned_same_nodata_mask.tif
    # --- co-registration ---------------------------------------------------
    # Coregistration stage fed into nDSM and mask. Both stages are always
    # written to process_out/dtm_coreg/<run_id>/ for comparison.
    #   plane   — global plane only (constant datum offset + tilt)
    #   aligned — plane + blockwise correction of local residual warp (±1 m)
    stage: aligned
    # Blocks per axis for the residual-warp correction. Fewer, larger blocks
    # hold more open ground each → cleaner ground anchor in half-forested terrain.
    # 12 ≈ 29 m on the 5 cm grid. 24 (≈14 m) lifted the DTM too far: ring offsets
    # in out/dsm_overview/dem_offsets.csv went from +0.17 m (plane) to -0.12 m.
    local_blocks: 6
    # Guard: coregistered DTM never above DSM (nDSM >= 0). The number of clamped
    # pixels is logged first — it measures the remaining block-fit error.
    clamp_to_dsm: true
    # Global surface of the first stage: plane (offset + tilt) | quadratic (plus
    # doming of a photogrammetric block without ground control, 1.84 m on 20250719).
    # Also used for a shared dtm_approx (dtm_approx_source).
    surface: quadratic
  # Height systems of DSM and terrain (external DTM, shared dtm_approx) against
  # Copernicus GLO-30, orthometric vs. ellipsoidal; reported in the log and
  # dates.json. enabled: the check before stage 1b; convert: stage 1b converts
  # the terrain into the DSM's height system by the geoid before the
  # co-registration (no fit). Needs network once per raster (cached).
  datum_check:
    enabled: true
    convert: true
    cache: datafiles/process_out/vertical_datum.json
  # method builds the mask (ground truth); ndsm_channel builds the nDSM the
  # model gets as input. Both: dtm_approx (DSM only) | dtm (external DTM).
  # ndsm_channel null -> same as method. Mask from dtm + channel from
  # dtm_approx: best labels, and a channel that also exists where prediction
  # has no DTM (predict config: preprocess.ndsm_channel must match).
  # method != ndsm_channel: both nDSMs are scaled to [0,1] and compared (MSE,
  # error map dtm_approx - dtm) in process_out/ndsm_compare/<run_id>/.
  method: dtm
  ndsm_channel: dtm_approx
  # DSM-only terrain approximation (method: dtm_approx): progressive
  # morphological filter on a coarse grid, see apply_dsm_mask.approximate_dtm.
  # A feature counts as terrain when its flanks are no steeper than about
  # max_slope + 2*dh0/window_step (embankments stay ground, crowns are removed).
  # Values from the dtm_approx sweeps on 20250719 and 20260313
  # (experiments/exp_logs.md, out/dtm_approx_sweep/): vs. the external-DTM nDSM
  # rmse_m 0.174 (20250719) / 0.255 (20260313), previously 0.314 on 20260313.
  dtm_approx:
    cell: 1.0           # m, coarse-grid cell size the morphology runs on (was 0.5)
    percentile: 1       # per-cell DSM percentile = robust minimum (ignores pits) (was 5)
    max_window: 30.0    # m, widest object (canopy patch) to remove
    window_step: 1.0    # m, growth of the opening window per step; at least 2 x cell (2 m here)
    max_slope: 0.5      # tan of the steepest flank still counted as terrain (~27 deg)
    dh0: 0.1            # m, height tolerance per step for DSM noise (was 0.2)
    smooth_sigma: 2.0   # m, Gaussian smoothing of the terrain surface (was 1.0)
    # Wall filter: elongated, smooth object regions (walls, dams) go back to
    # terrain, growth on them stays object (keep_smooth_elongated). The best
    # roughness threshold is scene-dependent: 0.15 on 20250719, 0.2 on 20260313.
    keep_min_elongation: 5.0  # 0 = filter off
    keep_max_roughness: 0.15  # m, DSM std within a cell
    keep_group_roughness: 0.0 # m, looser grouping threshold; 0 = keep_max_roughness
  # One terrain for all dates instead of a dtm_approx per date (leaf-on dates
  # show no ground under closed canopy). Built once with the dtm_approx block
  # above from the source date's DSM, then per date converted by the geoid and
  # co-registered like the external DTM (dtm_real stage / surface / blocks).
  # Predict needs the same raster: preprocess.dtm_approx_source.path.
  dtm_approx_source:
    date: null  # needs a timeseries section; use path for a single scene
    path: null  # raster built by a time-series run, e.g. <work_dir>/dtm_approx_shared/<date>_dtm_approx_<digest>.tif
  height_threshold: 0.7 # nDSM below this (m) counts as ground
  # Smoothstep ramp width (m) above height_threshold: ground_conf goes 1 → 0 over [ht, ht + height_ramp].
  # Narrower = more bimodal labels. null → ramp = height_threshold (legacy, 0 at 2*ht)
  height_ramp: 2.5
  # nDSM ceiling (m) for [0,1] scaling of the 5th input channel: ground → 0, above ceiling → 1.
  max_ndsm_height: 16.0
  # resolve 255 values ? :
  # noData pixels (255, i.e. no crown polygon) with ground_conf >= this threshold are relabelled .
  # the label becomes the continuous value 1 - ground_conf
  # (e.g. conf 0.9 -> label 0.1, conf 1.0 -> label 0.0), so it is a soft "almost surely not crown" target, not a hard 0.
  nodata_resolve_threshold: 0.5

  # Symmetric resolve towards crown: noData pixels with ground_conf <= this
  # (surely not ground, i.e. tall vegetation without polygon) get label
  # 1 - ground_conf instead of being excluded from the loss. 255 remains only
  # for the gray zone in between and DSM gaps. Must be < nodata_resolve_threshold.
  # null → disabled (legacy).
  crown_resolve_threshold: 0.3

  # Protects digitised stage-1a crowns (crown_mask_intermediate.tif): pixels
  # with a 1a label >= this keep their value and are NOT damped by
  # (1 - ground_conf) — the polygon outranks the height model.
  #   1.0  → only fully labelled crown pixels (all polygon pixels at sigma: 0.0)
  #   <1.0 → also the soft edge from this value up
  #   null → disabled, DSM damps every crown pixel (legacy)
  preserve_crown_threshold: 1.0

tiling:
  # image: exact path produced by rasterize ({out_image_dir}/{reference_stem}_stack.tif)
  image: datafiles/process_out/images/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_coreg_stack.tif
  # mask and dsm are set automatically by preprocess.py from dsm_mask outputs.
  # When running tile_patches.py standalone, pass --mask and --dsm explicitly.
  out: out/crown_patches_fullstack
  size: 512
  # skip patches with > this fraction of noData pixels in the mask (== 255)
  nodata_thresh: 0.8
  # skip patches with > this fraction of all-zero pixels across all MS bands (sensor gaps / edge padding)
  img_nodata_thresh: 0.8

split:
  input: out/crown_patches_fullstack   # output of tiling stage
  output: out/crown_patches_fullstack_hr2.5_ht_0.7         # train/val/test split destination; train_stats.json written here
  train_ratio: 0.7
  val_ratio: 0.2
  seed: 42
  mode: copy                    # "copy" or "symlink"
