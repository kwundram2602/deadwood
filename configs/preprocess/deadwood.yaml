# Deadwood fine-tuning preprocessing. Runs on its own — not part of
# scripts/preprocess.py and not sharing its config.
#
# Usage:
#   uv run python scripts/preprocess_deadwood.py \
#       --config configs/preprocess/deadwood.yaml --working_dir .

deadwood_preprocess:
  # Scene → uint8 RGB. These three blocks are passed verbatim to
  # raw_predict_deadwood.prepare_rgb8, so the training pixels are byte-identical
  # to the ones the baseline was measured on. The whole scene is prepared: the
  # tile filter drops what carries no label, which is the same job a clip did
  # worse.
  source:
    path: datafiles/raster_merged/20260313/20260313_Airport_Main_MAVICM3MFIXEDM3M_OM_RGB_merged.tif
    bands: [1, 2, 3]
  target_gsd: 0.05        # the model's own minimum inference resolution
  scale:
    mode: linear
    source_max: 65535

  labels:
    deadwood_path: datafiles/crown_poly/soff_altered.gpkg
    background_path: datafiles/crown_poly/background_not_deadwood_digital.gpkg
    # fid 21 is 0.018 m2 (8x8 px) — below min_polygon_area: 0.1, so no
    # prediction that size survives vectorisation and it can never be hit.
    exclude_fids: [21]

  mask:
    # Asymmetric on purpose. Blurring conserves burned area, so a wide sigma
    # flattens small polygons: at 50 cm a 0.32 m2 crown peaks at 0.18. The
    # smallest kept crowns are 0.32 and 0.48 m2, which caps sigma_pos near 4 px.
    # Background polygons have a median area of 21.5 m2 and absorb 10 px
    # harmlessly — and the wider blur is what guarantees an unlabelled band
    # between the classes even where they are drawn edge to edge.
    sigma_pos: 0.0        # 
    sigma_neg: 0.0       #  
    # Positives are kept out to 35 cm past the drawn edge; negatives start 65 cm
    # inside their own. Band between two polygons = separation + 30 cm.
    pos_threshold: 0.05
    neg_threshold: 0.9

  tiling:
    size: 512             # 25.6 m. Inference still runs at the native 1024.
    # Two independent filters. min_labelled_px is about a label being present
    # and deliberately does not require positives — background-only tiles are
    # the false-positive-suppression signal. max_outside_frac is about the
    # imagery being present.
    min_labelled_px: 500
    max_outside_frac: 0.5

  split:
    train: 0.6
    val: 0.2
    test: 0.2
    stratify: true        # deal each tile kind separately
    seed: 0

  out_dir: out/deadwood_patches
