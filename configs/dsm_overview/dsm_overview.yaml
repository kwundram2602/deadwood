# Diagnostic: is the flat nDSM over the soff crowns a co-registration artefact?
# out/spectral/overview/topography_tree.csv.
# uv run python scripts/dsm_overview.py --config configs/dsm_overview/dsm_overview.yaml --working_dir .
overview:
  # Grid only. The same reference the spectral stage and apply_dsm_mask use.
  reference: datafiles/process_out/masks/crown_mask.tif
  dsm: datafiles/raster_merged/20260313/20260313_Airport_Main_MAVICM3MFIXEDM3M_DSM_merged.tif
  # 0.5 m, flown 2025-07-27 — a different survey eight months before the DSM.
  # That gap is exactly what align_dtm_to_dsm has to absorb.
  dtm: datafiles/dtm/20250727_Airport_M350L2_dem.tif
  crowns:
    - datafiles/crown_poly/2_crown_main_20260409_editLP.gpkg
  categories: [soff]
  # Coverage classes that cannot be evaluated. `fc` = fully covered: the crown
  # is under closed canopy, the DSM shows the tree above. Affects 4 of 18 soff crowns.
  exclude_coverage: [fc]
  # null = every crown in the categories above. A list restricts the run, which
  # is what you want while iterating on the view angle. Written as a plain
  # list here, so a bare number like `4144` parses as YAML int; run_dsm_overview
  # coerces it to str before comparing against the tree_id column.
  tree_ids: null
  out_dir: out/dsm_overview
  local_blocks: 6
  # Deliberately false, unlike production: the guard would clip exactly the
  # excess this analysis shows. Keeps frac_dtm_above_dsm in dem_offsets.csv meaningful.
  clamp_to_dsm: false

aoi:
  # Metres around the crown bounds, for the PLOT only — how much surrounding
  # ground the 3D panels show. Does not affect any number in the CSV: those
  # come from `ring_gap_m`/`ring_width_m` below.
  buffer_m: 10.0
  # Gap between crown and ring, keeping half-canopy edge pixels out of the
  # ground level.
  ring_gap_m: 2.0
  # Width of the ground annulus the statistics are measured against, starting
  # `ring_gap_m` out from the crown. Kept narrow and fixed so the ring stays a
  # true local reference even on sloping terrain, instead of scaling with
  # `buffer_m` the way "everything outside the crown in the AOI" used to.
  ring_width_m: 4.0
  # The threshold apply_dsm_mask calls ground (dsm_mask.height_threshold).
  # Drawn into the nDSM panel as a plane.
  height_threshold: 0.5

plot:
  # Longest side of the plotted patch after striding.
  max_side: 200
  # 3D panel view angle. elev = angle above horizontal; higher = steeper
  # top-down view, keeps the crown outline readable (below ~25 it merges into
  # the silhouette). azim rotates the scene about the z axis.
  elev: 45.0
  azim: -60.0
